<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7c3aed" />
  <title>Counter Cards</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          keyframes: {
            'fade-in-up': { '0%': { opacity: '0', transform: 'translateY(8px) scale(0.98)' }, '100%': { opacity: '1', transform: 'translateY(0) scale(1)' } },
            'pulse-soft': { '0%, 100%': { opacity: '1' }, '50%': { opacity: '0.6' } },
          },
          animation: {
            'fade-in-up': 'fade-in-up 0.25s ease-out',
            'pulse-soft': 'pulse-soft 0.4s ease-out',
          },
        },
      },
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    * { transition: background-color 0.3s ease, border-color 0.3s ease, color 0.2s ease; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
  </style>
</head>

<body class="min-h-screen font-sans antialiased
             bg-gradient-to-br from-slate-50 via-purple-50 to-blue-50
             dark:from-[#0b0719] dark:via-[#150a2e] dark:to-[#0a1228]
             text-slate-800 dark:text-slate-100
             p-4 sm:p-6 lg:p-8 select-none">

  <div class="pointer-events-none fixed inset-0 overflow-hidden -z-10">
    <div class="absolute -top-32 -left-32 w-80 h-80 rounded-full bg-purple-400/30 dark:bg-purple-600/20 blur-3xl"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 rounded-full bg-blue-400/30 dark:bg-blue-600/20 blur-3xl"></div>
  </div>

  <div class="max-w-5xl mx-auto">

    <header class="flex items-center justify-between mb-6 sm:mb-8">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-purple-500 to-blue-500
                    shadow-lg shadow-purple-500/30 flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
          </svg>
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight
                     bg-gradient-to-r from-purple-600 to-blue-600
                     dark:from-purple-400 dark:to-blue-400
                     bg-clip-text text-transparent">
            Counter Cards
          </h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">Track anything, beautifully.</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="theme-toggle" aria-label="Toggle theme"
          class="w-11 h-11 rounded-xl bg-white/70 dark:bg-slate-800/70 backdrop-blur
                 border border-purple-200/70 dark:border-purple-800/60
                 hover:bg-white dark:hover:bg-slate-700/70 active:scale-95 transition
                 flex items-center justify-center shadow-sm">
          <svg id="icon-sun" class="hidden w-5 h-5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 3v1m0 16v1m8.66-9h-1M4.34 12h-1m14.14-6.36l-.71.71M6.93 17.07l-.71.71m12.02 0l-.71-.71M6.93 6.93l-.71-.71M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
          <svg id="icon-moon" class="w-5 h-5 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
        </button>

        <button id="add-card"
          class="h-11 px-4 sm:px-5 rounded-xl font-semibold text-white
                 bg-gradient-to-r from-purple-600 to-blue-600
                 hover:from-purple-500 hover:to-blue-500 active:scale-95 transition
                 shadow-lg shadow-purple-500/30 dark:shadow-purple-900/40
                 flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
          </svg>
          <span class="hidden sm:inline">Add Card</span>
        </button>
      </div>
    </header>

    <div id="cards-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>

    <div id="empty-state"
         class="hidden text-center py-16 rounded-3xl
                border-2 border-dashed border-purple-200 dark:border-purple-900/60
                bg-white/40 dark:bg-slate-900/30 backdrop-blur">
      <div class="w-16 h-16 mx-auto mb-4 rounded-2xl
                  bg-gradient-to-br from-purple-500/20 to-blue-500/20
                  flex items-center justify-center">
        <svg class="w-7 h-7 text-purple-500 dark:text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
      </div>
      <p class="font-semibold text-slate-700 dark:text-slate-200">No cards yet</p>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Tap “Add Card” to create your first counter.</p>
    </div>

  </div>

  <script>
    const STORAGE_KEY = 'counter-cards-v3';
    const THEME_KEY   = 'counter-theme-v3';
    let cards = [];

    /* ---------------- Theme ---------------- */
    const html = document.documentElement;
    const iconSun  = document.getElementById('icon-sun');
    const iconMoon = document.getElementById('icon-moon');

    function applyTheme(theme) {
      html.classList.toggle('dark', theme === 'dark');
      iconSun.classList.toggle('hidden',  theme !== 'dark');
      iconMoon.classList.toggle('hidden', theme === 'dark');
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = theme === 'dark' ? '#0b0719' : '#7c3aed';
    }

    const savedTheme = localStorage.getItem(THEME_KEY);
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(savedTheme || (prefersDark ? 'dark' : 'light'));

    document.getElementById('theme-toggle').addEventListener('click', () => {
      const next = html.classList.contains('dark') ? 'light' : 'dark';
      localStorage.setItem(THEME_KEY, next);
      applyTheme(next);
    });

    /* ---------------- Data ---------------- */
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) cards = JSON.parse(stored);
    } catch (e) { cards = []; }

    const container  = document.getElementById('cards-container');
    const emptyState = document.getElementById('empty-state');
    const PLACEHOLDER = 'Count what you want';

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(cards)); }
    function updateEmptyState() { emptyState.classList.toggle('hidden', cards.length > 0); }

    /* ---------------- Card builder ---------------- */
    function createCardElement(card) {
      const div = document.createElement('div');
      div.dataset.id = card.id;
      div.className =
        'group relative overflow-hidden rounded-2xl p-5 flex flex-col gap-4 ' +
        'bg-white/80 dark:bg-slate-900/70 backdrop-blur-xl ' +
        'border border-purple-100 dark:border-purple-900/50 ' +
        'shadow-lg shadow-purple-500/5 dark:shadow-purple-900/30 ' +
        'hover:shadow-xl hover:shadow-purple-500/10 dark:hover:shadow-purple-900/40 ' +
        'hover:-translate-y-0.5 transition-all duration-300 animate-fade-in-up';

      div.innerHTML = `
        <div class="absolute inset-x-0 top-0 h-1
                    bg-gradient-to-r from-purple-500 via-indigo-500 to-blue-500
                    opacity-70 group-hover:opacity-100 transition"></div>

        <div class="flex items-center gap-2 pt-1">
          <span class="w-2 h-2 rounded-full bg-gradient-to-br from-purple-500 to-blue-500
                       shadow-sm shadow-purple-500/50 shrink-0"></span>
          <input type="text"
                 class="card-title flex-1 bg-transparent outline-none
                        text-base font-semibold
                        text-slate-800 dark:text-slate-100
                        placeholder:text-slate-400 dark:placeholder:text-slate-500
                        placeholder:font-medium placeholder:italic
                        border-b border-transparent
                        focus:border-purple-400 dark:focus:border-purple-500
                        transition-colors pb-0.5"
                 placeholder="${PLACEHOLDER}"
                 maxlength="40" />
        </div>

        <div class="flex items-center justify-between gap-3">
          <button data-action="minus" aria-label="Decrease"
            class="w-12 h-12 rounded-xl flex items-center justify-center text-xl font-bold
                   bg-purple-100 dark:bg-purple-950/60
                   text-purple-700 dark:text-purple-300
                   hover:bg-purple-200 dark:hover:bg-purple-900/70
                   active:scale-90 transition shadow-sm">
            −
          </button>

          <span class="count-display flex-1 text-center text-4xl font-extrabold tabular-nums
                       bg-gradient-to-r from-purple-600 to-blue-600
                       dark:from-purple-400 dark:to-blue-400
                       bg-clip-text text-transparent">
            ${card.count}
          </span>

          <button data-action="plus" aria-label="Increase"
            class="w-12 h-12 rounded-xl flex items-center justify-center text-xl font-bold text-white
                   bg-gradient-to-br from-purple-600 to-blue-600
                   hover:from-purple-500 hover:to-blue-500 active:scale-90 transition
                   shadow-lg shadow-purple-500/30 dark:shadow-purple-900/40">
            +
          </button>
        </div>

        <div class="flex items-center justify-between pt-2
                    border-t border-purple-100/70 dark:border-purple-900/40">
          <button data-action="reset"
            class="text-xs font-medium px-3 py-1.5 rounded-lg
                   text-slate-500 dark:text-slate-400
                   hover:text-blue-600 dark:hover:text-blue-400
                   hover:bg-blue-50 dark:hover:bg-blue-950/40
                   transition flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M4 4v5h5M20 20v-5h-5M20 9A8 8 0 006.3 5.7L4 8m16 8l-2.3 2.3A8 8 0 014 15"/>
            </svg>
            Reset
          </button>

          <button data-action="remove"
            class="text-xs font-medium px-3 py-1.5 rounded-lg
                   text-slate-500 dark:text-slate-400
                   hover:text-red-600 dark:hover:text-red-400
                   hover:bg-red-50 dark:hover:bg-red-950/40
                   transition flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M19 7l-.9 12.1A2 2 0 0116.1 21H7.9a2 2 0 01-2-1.9L5 7m5 4v6m4-6v6M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3M4 7h16"/>
            </svg>
            Remove
          </button>
        </div>
      `;

      const titleInput = div.querySelector('.card-title');
      // IMPORTANT: only set value if a title was actually saved.
      // Empty string → placeholder shows through.
      titleInput.value = card.title || '';
      return div;
    }

    /* ---------------- Rendering ---------------- */
    function renderAll() {
      container.innerHTML = '';
      cards.forEach(card => container.appendChild(createCardElement(card)));
      updateEmptyState();
    }

    function addCard() {
      const newCard = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        title: '',   // ← empty by default, placeholder will show
        count: 0,
      };
      cards.push(newCard);
      container.appendChild(createCardElement(newCard));
      updateEmptyState();
      save();

      const el = container.lastElementChild?.querySelector('.card-title');
      if (el) el.focus();   // focus for quick naming (no select-all, since empty)
    }

    /* ---------------- Events ---------------- */
    container.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;

      const cardEl = btn.closest('[data-id]');
      if (!cardEl) return;
      const id = cardEl.dataset.id;
      const card = cards.find(c => c.id === id);
      if (!card) return;

      const action = btn.dataset.action;

      if (action === 'plus' || action === 'minus') {
        card.count += (action === 'plus' ? 1 : -1);
        const display = cardEl.querySelector('.count-display');
        display.textContent = card.count;
        display.classList.add('animate-pulse-soft');
        setTimeout(() => display.classList.remove('animate-pulse-soft'), 300);
      } else if (action === 'reset') {
        card.count = 0;
        const display = cardEl.querySelector('.count-display');
        display.textContent = '0';
        display.classList.add('animate-pulse-soft');
        setTimeout(() => display.classList.remove('animate-pulse-soft'), 300);
      } else if (action === 'remove') {
        cards = cards.filter(c => c.id !== id);
        cardEl.style.transition = 'opacity .2s ease, transform .2s ease';
        cardEl.style.opacity = '0';
        cardEl.style.transform = 'scale(0.95)';
        setTimeout(() => { cardEl.remove(); updateEmptyState(); }, 180);
        save();
        return;
      }
      save();
    });

    // Save title as user types (empty string is allowed and saved as empty)
    container.addEventListener('input', (e) => {
      if (!e.target.classList.contains('card-title')) return;
      const cardEl = e.target.closest('[data-id]');
      if (!cardEl) return;
      const card = cards.find(c => c.id === cardEl.dataset.id);
      if (card) {
        card.title = e.target.value;
        save();
      }
    });

    // Enter blurs the title
    container.addEventListener('keydown', (e) => {
      if (e.target.classList.contains('card-title') && e.key === 'Enter') {
        e.preventDefault();
        e.target.blur();
      }
    });

    document.getElementById('add-card').addEventListener('click', addCard);
    renderAll();

    // Seed one card for first-time users
    if (cards.length === 0) addCard();
  </script>
</body>
</html>
